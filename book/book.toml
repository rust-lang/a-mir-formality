[book]
authors = ["Niko Matsakis"]
language = "en"
src = "src"
title = "A MIR Formality"

[output.html]
git-repository-url = "https://github.com/rust-lang/a-mir-formality"

[preprocessor.judgment]
command = "cargo run -p formality-mdbook --"
source-dir = "../crates"

[preprocessor.skills]
command = "cargo run --quiet -p formality-mdbook-skills --"
before = ["links", "judgment"]
